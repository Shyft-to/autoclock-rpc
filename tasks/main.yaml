---
# tasks file for Solana RPC
- name: var check
  include_tasks: var_check.yaml

- name: create user
  include_tasks: user.yaml

- name: install dependencies
  include_tasks: deps.yaml

- name: folders
  include_tasks: dirs.yaml

- name: swap
  include_tasks: swap.yaml

- name: setup disks
  include_tasks: disks.yaml
  when: setup_disks|default(false)|bool == true

- name: setup accounts disks
  include_tasks: accounts-disk.yaml
  when: setup_disks|default(false)|bool == true and accounts_disk is defined

- name: logrotate
  include_tasks: rotate.yaml

- name: setup nginx
  include_tasks: nginx.yaml

- name: git
  include_tasks: git.yaml

- name: solana keygen
  include_tasks: keygen.yaml

- name: file setup
  include_tasks: file_setup.yaml

- name: tune host
  include_tasks: tuner.yaml

- name: Geyser GRPC
  include_tasks: grpc_geyser.yaml
  when: geyser is defined and geyser == "grpc"

- name: Transaction history
  when: txn_history|default(false)|bool == true
  become: true
  become_user: solana
  blockinfile:
    path: /home/solana/validator.sh
    block: |
      --enable-extended-tx-metadata-storage
      --enable-rpc-transaction-history \
    insertafter: '^--tpu-use-quic'

- name: Index
  when: index|default(false)|bool == true
  become: true
  become_user: solana
  blockinfile:
    path: /home/solana/validator.sh
    insertafter: '^--tpu-use-quic'
    block: |
      --account-index program-id spl-token-owner spl-token-mint \
      --account-index-exclude-key kinXdEcpDQeHPEuQnqmUgtYykqKGVFq6CeVX5iAHJq6 675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P srmqPvymJeFKQ4zGQed1GFppgkRHL9kaELCbyksJtPX hausS13jsjafwWwGqZTUQRmWyvyxn9EQpqMwV1PBBmk cndyAnrLdpjq1Ssp1z8xxDsB8dxe7u4HL5Nxi2K5WXZ cndy3Z4yapfJBmL3ShUp5exZKqR3z33thTzeNMm2gRZ metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s \

- name: snapshot download
  include_tasks: snapshot_downloader.yaml
  when: download_snapshot|default(true)|bool == true

- name: restart without waiting
  become: true
  become_user: root
  shell: /home/solana/restart.sh 1
  when: download_snapshot|default(true)|bool == true

- name: restart with waiting
  become: true
  become_user: root
  shell: /home/solana/restart.sh
  when: download_snapshot|default(true)|bool == false

- name: Start monitor script
  become: true
  become_user: root
  shell: systemctl enable --now monitor-sol.service
