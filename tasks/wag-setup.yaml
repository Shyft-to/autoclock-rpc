- name: build wag
  become: true
  become_user: root
  shell: wget https://s3.eu-central-1.amazonaws.com/new-cdn.shyft.to/assets/wag-setup.sh && sh ./wag-setup.sh
  args:
    chdir: /home/solana
    executable: /bin/bash

- name: set wag secret in Rocket.toml
  become: true
  become_user: solana
  lineinfile:
    path: /home/solana/wag-rs/Rocket.toml
    regexp: '^wag_secret\s*='
    line: 'wag_secret = "{{ wag_token }}"'
    insertafter: EOF
